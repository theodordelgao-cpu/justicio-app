<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Iris · Montage de DOE{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f4ef; --card:#ffffff; --ink:#1b2430; --muted:#6b7480; --line:#e4e0d6;
    --accent:#2f6f5e; --accent-soft:#e3efe9; --warn:#a4501e; --warn-soft:#fbeee3;
    --radius:12px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
  a{color:var(--accent)}
  header.top{background:var(--ink);color:#fff}
  header.top .wrap{display:flex;align-items:center;gap:12px;padding-top:14px;padding-bottom:14px}
  .logo{width:30px;height:30px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-weight:700}
  .brand b{font-size:17px}.brand span{color:#b9c2cc;font-size:13px;display:block;margin-top:-2px}
  .wrap{max-width:980px;margin:0 auto;padding:0 16px}
  main.wrap{padding-top:28px;padding-bottom:60px}
  h1{font-size:26px;margin:0 0 6px;letter-spacing:-.01em}
  h2{font-size:17px;margin:0 0 12px}
  .sub{color:var(--muted);margin:0 0 24px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:18px}
  label{display:block;font-weight:500;font-size:13px;margin:0 0 5px}
  input[type=text],select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff;color:var(--ink)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:640px){.grid{grid-template-columns:1fr}}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chips label{display:flex;align-items:center;gap:6px;font-weight:400;font-size:14px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;margin:0}
  .chips input{accent-color:var(--accent)}
  .btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;border:0;border-radius:8px;padding:11px 18px;font:600 15px Inter,sans-serif;cursor:pointer;text-decoration:none}
  .btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
  .btn.small{padding:6px 10px;font-size:13px}
  .flash{padding:10px 14px;border-radius:8px;margin-bottom:10px;font-size:14px}
  .flash.ok{background:var(--accent-soft);color:var(--accent)}
  .flash.erreur{background:var(--warn-soft);color:var(--warn)}
  .muted{color:var(--muted)}
  footer{color:var(--muted);font-size:12px;text-align:center;padding:30px 0}
</style>
{% block head %}{% endblock %}
</head>
<body>
<header class="top"><div class="wrap">
  <div class="logo">I</div>
  <div class="brand"><b>Iris</b><span>L'agent IA qui monte vos DOE · Standia</span></div>
</div></header>
<main class="wrap">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<footer>Iris · Standia — version de démonstration</footer>
</body>
</html>
